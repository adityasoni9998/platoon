# CISPO actor with a turn-level critic and turn rewards: quality deltas, tool penalties, and a test-run reward.
# Match CodeScout: K=4, critic LR=5e-6, beta2=.95 and weight_decay=.017 for both models.
# env.py fixes turn reward weights at 0.30 localization and 0.70 testing; each of the three tool-error
# categories costs 0.05 per turn.
# Quality deltas are charged on the turn they happen, drops included (immediate_regression_penalty).
# Test-run reward: +0.05 for each interval's last meaningful test run, where every source edit starts an
# interval (reproduction before the first edit, verification after each edit); none without a source edit.
# gamma=0.99 per turn, lambda=1.
# Requires a full-parameter Miles-Tinker server with --tinker-enable-critic and a fresh critic (no --critic-load).
# batch_size counts tasks: 512 tasks x 1 rollout = up to 512 trajectories/batch, with 512 concurrent workers.
# Otherwise matches train_issue_resolution_ppo_qwen3_4b_instruct_b128_tinker.yaml: 75 turns, 4096 output tokens
# in a 65K context, and the default2.j2 user prompt.
train:
  algorithm: ppo
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 65000
  batch_size: 512
  extra_rollout_groups: 0
  rollout_tail_tolerance_pct: 0.0  # Wait for all 512 slots: stale results that fill tail slots ratchet the stale count up.
  num_epochs: null  # Use the 500-step budget instead of an epoch limit.
  max_training_steps: 500
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 1
  lora_rank: 0
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  ppo:
    value_granularity: turn
    reward_mode: turn
    advantage_normalization_granularity: turn
    # Discount per turn: a reward 75 turns later counts 0.99^75 = 0.47 as much.
    gamma: 0.99
    gae_lambda: 1.0
    advantage_normalization: batch
    actor_epochs: 1
    critic_epochs: 1
    critic_warmup_batches: 12  # One loader epoch: floor(6542 / 512), with drop_last=True.
    # K=4 gives 48 critic optimizer updates across those 12 warmup batches.
    critic:
      value_clip: 0.2
      num_minibatches: 4
      num_microbatches: 1
      optimizer:
        learning_rate: 5.0e-6
        beta1: 0.9
        beta2: 0.95
        eps: 1.0e-8
        weight_decay: 0.017
        grad_clip_norm: 1.0
  workflow_config:
    group_size: 1
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 75
      verbose: true
      train: true
      timeout: 1800
      step_timeout: 600
      extra:
        worker_start_method: forkserver  # exec retains the fresh-interpreter launcher.
        workspace:
          type: apptainer
          apptainer:
            sif_dir: /groups/gai51740/aci19058gb/apptainer/sif
            cache_dir: /groups/gai51740/aci19058gb/apptainer/cache/apptainer
            scratch_dir: null  # Required CLI override: current allocation's node-local scratch.
        max_input_tokens: 60904  # 65000 - 4096
        user_prompt: default2.j2
        test_run_reward: 0.05
        immediate_regression_penalty: true
        use_binary_reward: false
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096
  num_concurrent_rollout_workflow_workers: 512

eval:
  strategy: none

checkpoint:
  strategy: step
  # Counts trainer batches, including the 12 critic-only warmup batches.
  # The first scheduled save is during critic warmup.
  every: 10
  load_checkpoint_path: null

watchdog:
  enabled: false

log_path: /groups/gai51740/aci19058gb/miles_hyperion
tinker_base_url: null  # Set --tinker_base_url at launch.

stats:
  experiment_name: issue-resolution-rebench-tinker
  trial_name: null  # Set --stats.trial_name at launch.
  wandb:
    mode: online
    project: issue_resolution-miles
    entity: null
    tags: [issue_resolution, swe_rebench, tinker, cispo, critic, k4, turn_critic, turn_rewards, prompt_default2, test_run_reward, immediate_regression, gamma099]

inference_tunnel:
  backend: none
