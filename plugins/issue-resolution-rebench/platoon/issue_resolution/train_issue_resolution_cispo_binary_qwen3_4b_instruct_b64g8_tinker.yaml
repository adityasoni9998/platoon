# Critic-free CISPO on the sparse binary reward: run n4warpkf (train_issue_resolution_fft_tinker.yaml at 48b7930), with
# the current prompt and limits, and on Apptainer.
# Changes from n4warpkf:
#   - user_prompt: default2.j2 (was default.j2).
#   - max_steps: 75 (was 40); max_completion_tokens: 4096 (was 2048); max_input_tokens: 60904 = 65000 - 4096 (was 62952).
#   - workspace: Apptainer (was Modal), with forkserver workers, as in the current runs.
# Unchanged: group-relative advantages, no critic; binary reward: 1 when the final patch resolves the task, else 0.
# batch_size counts tasks: 64 tasks x 8 rollouts = 512 trajectories/batch. num_epochs: 2 = 204 steps (102 per epoch).
# Server: ~/multi_node_rebench_3nodes_nocritic.pbs (no critic; 8 train + 16 inference GPUs).
train:
  algorithm: grpo  # Group-relative advantages; no critic.
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 65000
  batch_size: 64
  extra_rollout_groups: 0
  rollout_tail_tolerance_pct: 0.0  # Wait for all 512 slots: stale results that fill tail slots ratchet the stale count up.
  num_epochs: null
  max_training_steps: 201
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 1
  lora_rank: 0
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 75
      verbose: true
      train: true
      timeout: 1800
      step_timeout: 600
      extra:
        worker_start_method: forkserver  # exec retains the fresh-interpreter launcher.
        workspace:
          type: apptainer
          apptainer:
            sif_dir: /groups/gai51740/aci19058gb/apptainer/sif
            cache_dir: /groups/gai51740/aci19058gb/apptainer/cache/apptainer
            scratch_dir: null  # Required CLI override: current allocation's node-local scratch.
        max_input_tokens: 60904  # 65000 - 4096
        user_prompt: default2.j2
        use_binary_reward: true
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096
  # Counts task workflows; each launches group_size rollouts (512 concurrent rollouts).
  num_concurrent_rollout_workflow_workers: 64

eval:
  strategy: none

checkpoint:
  strategy: step
  every: 10
  load_checkpoint_path: null

watchdog:
  enabled: false

log_path: /groups/gai51740/aci19058gb/miles_hyperion
tinker_base_url: null  # Set --tinker_base_url at launch.

stats:
  experiment_name: issue-resolution-rebench-tinker
  trial_name: null  # Set --stats.trial_name at launch.
  wandb:
    mode: online
    project: issue_resolution-miles
    entity: null
    tags: [issue_resolution, swe_rebench, tinker, cispo, no_critic, sparse_orm, binary_reward, b64_g8, prompt_default2]

inference_tunnel:
  backend: none
