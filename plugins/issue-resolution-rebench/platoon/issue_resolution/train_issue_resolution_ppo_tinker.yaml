# CISPO actor with a turn-level critic, tool penalties, and settled quality deltas.
# Match CodeScout: K=4, critic LR=5e-6, beta2=.95 and weight_decay=.017 for both models.
# env.py fixes turn reward weights at 0.30 localization and 0.70 testing.
# Each of the three tool-error categories costs 0.05 per turn; max total reward is 1.0.
# Intermediate quality deltas are nonnegative; the final turn settles regressions.
# Requires a full-parameter Miles-Tinker server with --tinker-enable-critic.
# Initialize critic weights on the server with --critic-load plus
# --finetune --no-load-optim --no-load-rng; leave client checkpoint loading disabled.
# batch_size counts tasks: 512 tasks x 1 rollout = up to 512 trajectories/batch.
# 512 concurrent group workers preserve the previous rollout concurrency.
train:
  algorithm: ppo
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 65000
  batch_size: 512
  extra_rollout_groups: 0
  rollout_tail_tolerance_pct: 2.0  # Stop waiting after 502/512 slots (including stale/failed results) if the queue is empty.
  num_epochs: null  # Use the 500-step budget instead of an epoch limit.
  max_training_steps: 500
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 1
  lora_rank: 0
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  ppo:
    value_granularity: turn
    reward_mode: turn
    advantage_normalization_granularity: turn
    # gamma=lambda=1 gives undiscounted reward-to-go, including final settlement.
    gamma: 1.0
    gae_lambda: 1.0
    advantage_normalization: batch
    actor_epochs: 1
    critic_epochs: 1
    critic_warmup_batches: 12  # One loader epoch: floor(6542 / 512), with drop_last=True.
    # K=4 gives 48 critic optimizer updates across those 12 warmup batches.
    critic:
      value_clip: 0.2
      num_minibatches: 4
      num_microbatches: 1
      optimizer:
        learning_rate: 5.0e-6
        beta1: 0.9
        beta2: 0.95
        eps: 1.0e-8
        weight_decay: 0.017
        grad_clip_norm: 1.0
  workflow_config:
    group_size: 1
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 40
      verbose: true
      train: true
      timeout: 1800
      step_timeout: 600
      extra:
        worker_start_method: forkserver  # exec retains the fresh-interpreter launcher.
        workspace:
          type: apptainer
          apptainer:
            sif_dir: /groups/gai51740/aci19058gb/apptainer/sif
            cache_dir: /groups/gai51740/aci19058gb/apptainer/cache/apptainer
            scratch_dir: null  # Required CLI override: current allocation's node-local scratch.
        max_input_tokens: 62952
        use_binary_reward: false
      inference_params:
        temperature: 1.0
        max_completion_tokens: 2048
  num_concurrent_rollout_workflow_workers: 512

eval:
  strategy: none

checkpoint:
  strategy: step
  # Counts trainer batches, including the 12 critic-only warmup batches.
  # The first scheduled save is during critic warmup.
  every: 10
  load_checkpoint_path: null

watchdog:
  enabled: false

log_path: /groups/gai51740/aci19058gb/miles_hyperion
tinker_base_url: null  # Set --tinker_base_url at launch.

stats:
  experiment_name: issue-resolution-rebench-tinker
  trial_name: qwen3-4b-cispo-critic110-apptainer-b512-g1-k4-20261029
  wandb:
    mode: online
    project: issue_resolution-miles
    entity: null
    tags: [issue_resolution, swe_rebench, tinker, cispo, critic, k4, turn_critic, turn_rewards]

inference_tunnel:
  backend: none
