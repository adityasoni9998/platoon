[project]
name = "platoon-dapo-math"
version = "0.1.0"
description = "DAPO-Math-17K rollouts for Platoon's Tinker trainer."
requires-python = "~=3.12.0"
dependencies = [
    "platoon>=0.1.0",
    "huggingface-hub",
    "sympy",
    "pylatexenc",
]

[project.optional-dependencies]
tinker = ["platoon[tinker]"]

[tool.uv.sources]
platoon = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]
