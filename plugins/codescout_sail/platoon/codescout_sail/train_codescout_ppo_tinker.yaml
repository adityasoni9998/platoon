# CodeScout on Apptainer: context and episode settings from codescout-platoon-tinker/rfchcgg4.
# 256 tasks per batch, one rollout per task, up to 256 concurrent rollouts.
# PPO and optimizer settings from number_search_ppo_tinker.yaml.
# Requires a full-parameter Miles-Tinker server with --tinker-enable-critic.
train:
  algorithm: ppo
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 42048
  lora_rank: 0
  batch_size: 256
  num_epochs: 1
  max_training_steps: null
  num_minibatches: 1
  num_microbatches: 1
  num_concurrent_rollout_workflow_workers: 256
  max_staleness: 1
  loss_fn: ppo
  loss_fn_config:
    clip_low_threshold: 0.8
    clip_high_threshold: 1.2
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.98
    eps: 1.0e-8
    weight_decay: 0.1
    grad_clip_norm: 1.0
  ppo:
    value_granularity: turn
    # Preserve CodeScout's outcome reward: localization F1 + four-turn bonus.
    reward_mode: terminal
    advantage_normalization_granularity: turn
    gamma: 0.99
    gae_lambda: 0.9
    advantage_normalization: batch
    actor_epochs: 1
    critic_epochs: 1
    # One critic-only trainer batch: four minibatch updates, no actor update.
    critic_warmup_batches: 1
    critic:
      value_clip: 0.2
      # Split prepared datums into four minibatches; keep the remainder in the last.
      num_minibatches: 4
      num_microbatches: 1
      optimizer:
        learning_rate: 5.0e-6
        beta1: 0.9
        beta2: 0.98
        eps: 1.0e-8
        weight_decay: 0.1
        grad_clip_norm: 1.0
  workflow_config:
    group_size: 1
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 6
      # The trainer derives the final rollout directory from log_path and stats.
      output_dir: /data/user_data/adityabs/miles_sail/rollouts
      verbose: true
      timeout: 600
      extra:
        workspace:
          type: apptainer
          apptainer:
            sif_path: null
            cache_dir: null
            scratch_dir: null
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 2048

eval:
  strategy: none
checkpoint:
  strategy: step
  every: 500
  load_checkpoint_path: null

log_path: /data/user_data/adityabs/miles_sail
# Export TINKER_BASE_URL and TINKER_API_KEY for the critic-enabled service,
# or pass --tinker_base_url explicitly. Start a fresh run for this comparison.
tinker_base_url: null

inference_tunnel:
  backend: none
  modal:
    app_name: codescout-sail-inference-router
    cpu: 0.125
    memory: 128
    timeout: 86400

stats:
  experiment_name: codescout-platoon-tinker
  trial_name: qwen3_4b_ppo_sail_b256_g1_k4
  wandb:
    mode: online
    project: codescout-platoon-tinker
    entity: 9998_team
    tags: [codescout, sail, tinker, qwen3-4b-instruct, ppo, full-finetune]
