experiment_name: codescout-platoon-areal
trial_name: qwen3-4b-instruct-cispo-fsdp

seed: 42
total_train_epochs: 1
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/platoon_skyrl_areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: ${cluster.fileroot}/name_resolve

rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  scheduling_spec: ${actor.scheduling_spec}
  setup_timeout: 900
  max_concurrent_rollouts: 8
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 3
  enable_rollout_tracing: false
  agent:
    engine_max_tokens: 42048

workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 6
    output_dir: ${cluster.fileroot}/${experiment_name}/${trial_name}
    verbose: true
    train: true
    timeout: 600
    step_timeout: 300
    extra:
      max_input_tokens: 40000
    inference_params:
      temperature: 1.0
      max_completion_tokens: 2048
  group_size: 8
  use_subprocesses: false
  filter_zero_variance_groups: false

loss_fn_config:
  loss_fn: cispo
  loss_fn_kwargs:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0

actor:
  backend: fsdp:d2p1t1c2
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-4B-Instruct-2507
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 65000
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.0
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python -m areal.infra.rpc.rpc_server
      env_vars: {}
  eps_clip: 0.2
  eps_clip_higher: 0.26
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  reward_norm:
    mean_level: null
    std_level: null
  adv_norm:
    mean_level: null
    std_level: null

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 65000
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 42048
  max_prefill_tokens: 65000
  mem_fraction_static: 0.8

train_dataset:
  batch_size: 8

valid_dataset:
  batch_size: 8

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 20
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: codescout-platoon-areal
    entity: null
    tags:
      - codescout
      - areal
      - fsdp
