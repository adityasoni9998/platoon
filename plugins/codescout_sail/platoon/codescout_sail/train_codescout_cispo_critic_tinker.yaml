# CodeScout CISPO actor with turn-level critic and terminal outcome rewards.
# Gamma/lambda ablation: gamma=1 and lambda=1 with turn-level values and advantages.
# Retain the latest AdamW settings: beta2=.95 and weight_decay=.017 for both models.
# Keep 256x1, K=4, actor LR 1e-6 and critic LR 5e-6.
# 81 trainer batches = one critic-only warmup batch + 80 actor updates.
# Requires a full-parameter Miles-Tinker server with --tinker-enable-critic.
train:
  algorithm: ppo
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 42048
  lora_rank: 0
  batch_size: 256
  num_epochs: null
  max_training_steps: 81
  num_minibatches: 1
  num_microbatches: 1
  num_concurrent_rollout_workflow_workers: 256
  # Permit rollouts up to one published policy version behind.
  max_staleness: 1
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  # Match critic-free CISPO AdamW settings; preserve actor LR 1e-6.
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  ppo:
    value_granularity: turn
    # Preserve CodeScout's outcome reward: localization F1 + four-turn bonus.
    reward_mode: terminal
    advantage_normalization_granularity: turn
    gamma: 1.0
    gae_lambda: 1.0
    advantage_normalization: batch
    actor_epochs: 1
    critic_epochs: 1
    # One critic-only trainer batch: four minibatch updates, no actor update.
    critic_warmup_batches: 1
    critic:
      value_clip: 0.2
      # Split prepared datums into four minibatches; keep the remainder in the last.
      num_minibatches: 4
      num_microbatches: 1
      # Match critic-free CISPO AdamW settings; preserve critic LR 5e-6.
      optimizer:
        learning_rate: 5.0e-6
        beta1: 0.9
        beta2: 0.95
        eps: 1.0e-8
        weight_decay: 0.017
        grad_clip_norm: 1.0
  workflow_config:
    group_size: 1
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 6
      # The trainer derives the final rollout directory from log_path and stats.
      output_dir: /data/user_data/adityabs/miles_sail/rollouts
      verbose: true
      timeout: 600
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 2048

eval:
  strategy: none
checkpoint:
  strategy: step
  every: 500
  load_checkpoint_path: null

log_path: /data/user_data/adityabs/miles_sail
# Export TINKER_BASE_URL and TINKER_API_KEY for the critic-enabled service,
# or pass --tinker_base_url explicitly. Start a fresh run for this comparison.
tinker_base_url: null

inference_tunnel:
  backend: modal
  modal:
    app_name: codescout-sail-inference-router
    cpu: 0.125
    memory: 128
    timeout: 86400

stats:
  experiment_name: codescout-platoon-tinker
  trial_name: qwen3_4b_cispo_critic_sail_b256_g1_k4
  wandb:
    mode: online
    project: codescout-platoon-tinker
    entity: 9998_team
    tags: [codescout, sail, tinker, qwen3-4b-instruct, cispo, critic, k4, full-finetune]
