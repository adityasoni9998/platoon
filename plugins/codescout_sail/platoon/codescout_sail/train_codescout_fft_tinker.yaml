# CodeScout Tinker training configuration
train:
  context_window_length: 42048
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  batch_size: 8
  num_epochs: 1
  max_training_steps: null
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 0
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    rollout_config:
      max_steps: 6
      # The trainer derives the final rollout directory from log_path and stats.
      output_dir: /data/user_data/adityabs/miles_sail/rollouts
      verbose: true
      timeout: 600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 2048
    filter_zero_variance_groups: false
  num_concurrent_rollout_workflow_workers: 8 # total concurrent rollouts = workers * group_size

# Eval configuration
eval:
  strategy: none

# Checkpoint configuration
checkpoint:
  strategy: step
  every: 25
  load_checkpoint_path: null

# Logs, rollouts, W&B files, and checkpoints.jsonl live below this root.
# Weight/optimizer files use the Tinker server's --checkpoint-root setting.
log_path: /data/user_data/adityabs/miles_sail
tinker_base_url: https://ta-01m2p0702dzjhx272cvtmagyrs-8080-5b431ywrgxj13rgbw5uh34vsv.w.modal.host

inference_tunnel:
  backend: modal
  modal:
    app_name: codescout-sail-inference-router
    cpu: 0.125
    memory: 128
    timeout: 86400

stats:
  experiment_name: codescout-platoon-tinker
  trial_name: qwen3_4b_cispo_sail
  wandb:
    mode: online
    project: codescout-platoon-tinker
    entity: null
    tags:
      - codescout
      - tinker
