[project]
name = "platoon-codescout-sail"
version = "0.1.0"
description = "Platoon plugin for CodeScout's repository-level code localization recipe."
requires-python = "~=3.12.0"
authors = [
    {name = "Aditya Bharat Soni", email = "adityabs@cs.cmu.edu"}
]
dependencies = [
    "platoon >= 0.1.0",
    "platoon-openhands >= 0.1.0",
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace[sail]",
    "openhands-agent-server",
]

[project.optional-dependencies]
tinker = [
    "platoon[tinker]",
]
areal = [
    "platoon[areal]",
]

[tool.uv]
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    "torchao==0.15.0",
    "flash-attn-4>=4.0.0b4",
    "transformers>=5.0.0,<=5.3.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "networkx==3.3.0",
    "megatron-core==0.17.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hydra-core==1.4.0.dev1",
    "timm==1.0.16",
    "rich==14.3.1",
    "transformer-engine; sys_platform == 'never'",
    "nv-grouped-gemm; sys_platform == 'never'",
    "mamba-ssm; sys_platform == 'never'",
    "causal-conv1d; sys_platform == 'never'",
    "nvidia-resiliency-ext; sys_platform == 'never'",
]
no-build-isolation-package = ["flash-attn", "causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
platoon = { path = "../..", editable = true }
platoon-openhands = { path = "../openhands", editable = true }
openhands-sdk = { git = "https://github.com/adityasoni9998/software-agent-sdk.git", rev = "7dd27078ec2dba29e5a0a9d96c1f2d1a519c99a8", subdirectory = "openhands-sdk" }
openhands-tools = { git = "https://github.com/adityasoni9998/software-agent-sdk.git", rev = "7dd27078ec2dba29e5a0a9d96c1f2d1a519c99a8", subdirectory = "openhands-tools" }
openhands-workspace = { git = "https://github.com/adityasoni9998/software-agent-sdk.git", rev = "7dd27078ec2dba29e5a0a9d96c1f2d1a519c99a8", subdirectory = "openhands-workspace" }
openhands-agent-server = { git = "https://github.com/adityasoni9998/software-agent-sdk.git", rev = "7dd27078ec2dba29e5a0a9d96c1f2d1a519c99a8", subdirectory = "openhands-agent-server" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]
