# Number Search Tinker Training Configuration

# Training configuration
train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  batch_size: 32
  num_epochs: null
  max_training_steps: 100
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 32
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    weight_decay: 0.0
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    rollout_config:
      max_steps: 10
      output_dir: /tmp/rollout_results
      verbose: true
      timeout: 300
      inference_params:
        temperature: 1.0
        max_completion_tokens: 512
    filter_zero_variance_groups: false # setting this to true significantly impacts stability.

  num_concurrent_rollout_workflow_workers: 32 # number of task groups that run in paralle i.e. total concurrent rollouts = num_concurrent_rollout_workflow_workers * group_size

# Eval configuration
eval:
  strategy: step
  every: 150
  num_concurrent_rollout_workflow_workers: 16
  workflow_config:
    group_size: 1
    rollout_config:
      max_steps: 10
      output_dir: /tmp/eval_results
      verbose: false
      timeout: 300

# Checkpoint configuration
checkpoint:
  strategy: step
  every: 150
  load_checkpoint_path: null

# Logging
log_path: ./logs
tinker_base_url: null
# Stats and WandB configuration
stats:
  experiment_name: number-search-platoon-skyrl
  trial_name: grpo-trial3
  wandb:
    mode: online
    project: number-search-platoon-skyrl
    entity: null
    tags:
      - number-search
      - tinker
      - grpo

