# Critic-free async CISPO with group-based advantages and binary outcome reward.
reward_shaping:
  enabled: false
train:
  algorithm: grpo
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct_exact
  context_window_length: 32768
  batch_size: 32
  num_epochs: null
  max_training_steps: 250
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 1
  lora_rank: 0
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 1.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    leave_one_out_baseline: false
    depth_level_weighting: false
    filter_zero_variance_groups: false
    rollout_config:
      max_steps: 10
      output_dir: /tmp/rollout_results
      verbose: false
      timeout: 300
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 512
  num_concurrent_rollout_workflow_workers: 32
eval:
  strategy: none
  every: 0
checkpoint:
  strategy: step
  every: 500  # Beyond the 250-step cap; avoids periodic checkpoints.
  load_checkpoint_path: null
log_path: /data/user_data/adityabs/miles_tinker_smoke
tinker_base_url: null  # Set TINKER_BASE_URL and TINKER_API_KEY in the environment.
stats:
  experiment_name: number-search-ppo
  trial_name: cispo-outcome
  wandb:
    mode: online
    project: number-search-miles-tinker
    entity: 9998_team
    tags: [number-search, miles-tinker, qwen3-4b-instruct, mi350, full-finetune]
